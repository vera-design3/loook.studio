<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://vera-design3.github.io/">
<link rel="canonical" href="https://vera-design3.github.io/">
<meta name="robots" content="noindex, follow">
<title>已搬家</title>
<style>
:root{--bg:#F4F4F2;--ink:#1A1A1A;--muted:#8A8A8A;--lime:#D7F367}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;
 font-family:"Inter","Noto Sans TC",-apple-system,"PingFang TC",sans-serif;padding:24px;text-align:center}
.box{max-width:30rem}
.tag{display:inline-block;background:var(--lime);font-size:11px;font-weight:700;letter-spacing:.12em;
 padding:5px 12px;border-radius:100px;margin-bottom:20px}
h1{font-size:clamp(22px,5vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.4}
p{margin-top:14px;color:var(--muted);font-size:14.5px;line-height:1.7}
a{display:inline-block;margin-top:24px;color:var(--ink);font-weight:600;font-size:15px;
 border-bottom:2px solid var(--lime);text-decoration:none;padding-bottom:2px}
</style>
</head>
<body>
<div class="box">
  <span class="tag">已搬家</span>
  <h1>這個站已經搬到新的位置</h1>
  <p>正在帶你過去，如果沒有自動跳轉請點下方連結。</p>
  <a href="https://vera-design3.github.io/">前往 Vera 作品集 →</a>
</div>
<script>location.replace("https://vera-design3.github.io/")</script>
</body>
</html>
